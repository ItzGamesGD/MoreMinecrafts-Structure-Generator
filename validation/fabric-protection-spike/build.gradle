plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

group = 'dev.itzgamesgd.spike'
version = '0.0.1-spike'
base { archivesName = 'sg01-worldgen-protection-spike' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

loom {
    runs {
        server {
            server()
            runDir = 'run/server'
            // N7-A3: same heap as the vanilla lab launch (java -Xmx3G). SG01_BG_THREADS, if set, pins -Dmax.bg.threads for concurrency runs.
            vmArgs '-Xmx3G'
            def bgThreads = System.getenv('SG01_BG_THREADS')
            if (bgThreads) vmArgs "-Dmax.bg.threads=${bgThreads}"
        }
    }
}

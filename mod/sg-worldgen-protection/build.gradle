plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

group = 'dev.itzgamesgd.sg'
version = '0.3.1-n10r'
base { archivesName = 'sg-worldgen-protection' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// N7-D: production code is the main source set (jar sg-worldgen-protection); the validation lab is a separate mod in the lab source set (jar
// sg-worldgen-protection-lab, never shipped). The lab depends on main, never the other way round.
sourceSets {
    lab {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

// Empty source set: the "jarServer" run loads the BUILT production jar (as a mod from -Dfabric.addMods) instead of the dev class directories.
sourceSets {
    jarTest {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += configurations.runtimeClasspath
    }
}

tasks.register('labJar', Jar) {
    archiveClassifier = 'lab'
    from sourceSets.lab.output
}

loom {
    mods {
        "sg_worldgen_protection" { sourceSet sourceSets.main }
        "sg_worldgen_protection_lab" { sourceSet sourceSets.lab }
    }
    runs {
        // runServer = production configuration (main only); runLabServer = production + lab mod (what the validation harness uses)
        labServer {
            server()
            source sourceSets.lab
            runDir = 'run/server'
            vmArgs '-Xmx3G'
            vmArgs '-Dsg_worldgen_protection.lab=true'   // N10-R: operator opt-in for the lab entrypoint (never set for jarServer or server)
            def labBg = System.getenv('SG01_BG_THREADS')
            if (labBg) vmArgs "-Dmax.bg.threads=${labBg}"
            def labExtra = System.getenv('SG01_EXTRA_MODS')
            if (labExtra) vmArgs "-Dfabric.addMods=${labExtra}"
        }
        jarServer {
            server()
            source sourceSets.jarTest
            runDir = 'run/server'
            vmArgs '-Xmx3G'
            // SG01_EXTRA_MODS (validation only): extra jars, e.g. a lab jar, to test that the production artifact ignores them (N10-R)
            def jarExtra = System.getenv('SG01_EXTRA_MODS')
            def jarMods = layout.buildDirectory.file("libs/sg-worldgen-protection-${project.version}.jar").get().asFile.toString() + (jarExtra ? File.pathSeparator + jarExtra : '')
            vmArgs "-Dfabric.addMods=${jarMods}"
        }
        server {
            server()
            runDir = 'run/server'
            // N7-A3: same heap as the vanilla lab launch (java -Xmx3G). SG01_BG_THREADS, if set, pins -Dmax.bg.threads for concurrency runs.
            vmArgs '-Xmx3G'
            def bgThreads = System.getenv('SG01_BG_THREADS')
            if (bgThreads) vmArgs "-Dmax.bg.threads=${bgThreads}"
            // N7-A3 compatibility runs: SG01_EXTRA_MODS = path list of extra mod jars (loaded through fabric.addMods, never copied into the project).
            def extraMods = System.getenv('SG01_EXTRA_MODS')
            if (extraMods) vmArgs "-Dfabric.addMods=${extraMods}"
        }
    }
}

name: Validate structure exports

on:
  pull_request:
    paths:
      - "structure_export/**"
      - "examples/forgotten_kingdom/**"
      - "exports/sg-01/**"
      - "docs/sg-01/**"
      - "tests/**"
      - "requirements-export.txt"
      - ".github/workflows/validate-structures.yml"
  push:
    paths:
      - "structure_export/**"
      - "examples/forgotten_kingdom/**"
      - "exports/sg-01/**"
      - "docs/sg-01/**"
      - "tests/**"
      - "requirements-export.txt"
      - ".github/workflows/validate-structures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install export dependencies
        run: python3 -m pip install -r requirements-export.txt
      - name: Verify exported pack is reproducible
        run: python3 examples/forgotten_kingdom/build_cavern.py "$RUNNER_TEMP/sg01-datapack"
      - name: Verify exported resources match committed checksums
        run: diff -r exports/sg-01/forgotten-underground-kingdom/datapack "$RUNNER_TEMP/sg01-datapack"
      - name: Verify visual model and previews are reproducible
        run: |
          python3 examples/forgotten_kingdom/export_visual.py --output "$RUNNER_TEMP/sg01-visual"
          diff -r exports/sg-01/forgotten-underground-kingdom/visual "$RUNNER_TEMP/sg01-visual"
      - name: Run export and Jigsaw tests
        run: PYTHONPATH=vendor/mcbuild/src python3 -m unittest discover -s tests -v

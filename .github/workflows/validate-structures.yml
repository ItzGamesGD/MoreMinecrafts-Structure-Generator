name: Validate structure exports

on:
  pull_request:
    paths:
      - "structure_export/**"
      - "examples/forgotten_kingdom/**"
      - "exports/sg-01/**"
      - "docs/sg-01/**"
      - "tests/**"
      - "requirements-export.txt"
      - "validation/minecraft-visual/**"
      - ".github/workflows/validate-structures.yml"
  push:
    paths:
      - "structure_export/**"
      - "examples/forgotten_kingdom/**"
      - "exports/sg-01/**"
      - "docs/sg-01/**"
      - "tests/**"
      - "requirements-export.txt"
      - "validation/minecraft-visual/**"
      - ".github/workflows/validate-structures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install export dependencies
        run: python3 -m pip install -r requirements-export.txt
      - name: Verify exported pack is reproducible
        run: python3 examples/forgotten_kingdom/build_cavern.py "$RUNNER_TEMP/sg01-datapack"
      - name: Verify exported resources match committed checksums
        run: diff -r exports/sg-01/forgotten-underground-kingdom/datapack "$RUNNER_TEMP/sg01-datapack"
      - name: Verify visual model and previews are reproducible
        run: |
          python3 examples/forgotten_kingdom/export_visual.py --output "$RUNNER_TEMP/sg01-visual"
          diff -r exports/sg-01/forgotten-underground-kingdom/visual "$RUNNER_TEMP/sg01-visual"
      - name: Run export and Jigsaw tests
        run: PYTHONPATH=vendor/mcbuild/src python3 -m unittest discover -s tests -v

  minecraft-26-3-visual:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb, llvmpipe and screenshot tools
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers mesa-utils vulkan-tools xdotool imagemagick python3
      - name: Build untouched datapack and verify bytes
        run: |
          python3 -m pip install -r requirements-export.txt
          python3 examples/forgotten_kingdom/build_cavern.py "$RUNNER_TEMP/sg01-datapack"
          diff -r exports/sg-01/forgotten-underground-kingdom/datapack "$RUNNER_TEMP/sg01-datapack"
      - name: Configure Minecraft 26.3 Gradle fixture (no game launch)
        timeout-minutes: 5
        run: ./validation/minecraft-visual/gradlew --no-daemon -p validation/minecraft-visual help
      - name: Start Minecraft 26.3 server and perform live datapack acceptance
        id: runtime
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          chmod +x validation/minecraft-visual/gradlew
          validation/minecraft-visual/run-acceptance.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/sg01-datapack"
      - name: Record software graphics capabilities
        if: steps.runtime.outcome == 'success'
        shell: bash
        run: |
          mkdir -p validation/minecraft-visual/evidence
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render' glxinfo -B > validation/minecraft-visual/evidence/graphics-capabilities.txt 2>&1 || true
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render' vulkaninfo --summary >> validation/minecraft-visual/evidence/graphics-capabilities.txt 2>&1 || true
      - name: Run Minecraft 26.3 client and capture in-game views
        if: steps.runtime.outcome == 'success'
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          chmod +x validation/minecraft-visual/gradlew
          validation/minecraft-visual/capture-client.sh "$GITHUB_WORKSPACE"
      - name: Upload Minecraft runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-01-minecraft-26.3-visual-${{ github.run_id }}
          path: |
            validation/minecraft-visual/evidence/
            validation/minecraft-visual/run/logs/
          if-no-files-found: warn
          retention-days: 30

name: mcbuild CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and Ruff (locked versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        working-directory: vendor/mcbuild
        run: uv sync --frozen --extra dev
      - name: Pytest (includes the 2026-10-18 security regression tests)
        working-directory: vendor/mcbuild
        run: uv run pytest -q
      - name: Ruff lint
        working-directory: vendor/mcbuild
        run: uv run ruff check .
      - name: Ruff format
        working-directory: vendor/mcbuild
        run: uv run ruff format --check .

  vendor-drift:
    name: Committed vendor tree == pinned upstream + patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Read upstream pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          sha="$(cat repo/vendor/mcbuild/UPSTREAM_COMMIT)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::vendor/mcbuild/UPSTREAM_COMMIT is not a full commit SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: harrynull/mcbuild
          ref: ${{ steps.pin.outputs.sha }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Rebuild from pin + patches and compare
        shell: bash
        env:
          PIN: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$PIN"
          repo/vendor/patches/apply.sh upstream built
          # Any difference means someone edited vendor/mcbuild without updating the patch series,
          # or the snapshot drifted from the pin. Both must be fixed before merging.
          diff -r -x .git -x UPSTREAM.md -x UPSTREAM_COMMIT repo/vendor/mcbuild built

  java:
    name: Java compile (Gradle wrapper, JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and assemble the mod
        working-directory: vendor/mcbuild/mod
        run: |
          chmod +x gradlew
          ./gradlew assemble --no-daemon

  isolation-capabilities:
    name: Isolation capabilities (diagnostic, not a security pass)
    runs-on: ubuntu-latest
    steps:
      - name: Probe Linux namespace and Bubblewrap support
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner kernel: $(uname -r)"
          echo "Runner architecture: $(uname -m)"
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq bubblewrap
          fi
          set +e
          output="$(bwrap --unshare-user --unshare-net --unshare-pid --die-with-parent \
            --ro-bind /usr /usr --proc /proc --dev /dev --tmpfs /tmp \
            --chdir /tmp /usr/bin/python3 -c 'print("BWRAP_NAMESPACE_PROBE_OK")' 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] && grep -q BWRAP_NAMESPACE_PROBE_OK <<< "$output"; then
            echo "Namespace probe: SUPPORTED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Namespace probe: UNSUPPORTED (exit $status); do not weaken fail-closed isolation" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Bubblewrap/user namespaces unavailable. This is a diagnostic, not an accepted sandbox."
          fi
          set +e
          fs_output="$(bwrap --unshare-user --unshare-pid --die-with-parent \
            --ro-bind /usr /usr --proc /proc --dev /dev --tmpfs /tmp \
            --chdir /tmp /usr/bin/python3 -c 'print("BWRAP_FS_PROBE_OK")' 2>&1)"
          fs_status=$?
          set -e
          echo "$fs_output"
          if [ "$fs_status" -eq 0 ] && grep -q BWRAP_FS_PROBE_OK <<< "$fs_output"; then
            echo "Filesystem namespace probe (no network namespace): SUPPORTED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Filesystem namespace probe (no network namespace): UNSUPPORTED (exit $fs_status)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Bubblewrap mount isolation is unavailable on this runner."
          fi
          echo "This probe does not test effective file-read denial, network syscall filtering, or live NeoForge permissions." >> "$GITHUB_STEP_SUMMARY"

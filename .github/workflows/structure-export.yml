name: Structure export

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/structure_export/**"
      - "exports/**"
      - "tests/test_structure_export.py"
      - "artifacts/phase-3/final/final.schem"
      - ".github/workflows/structure-export.yml"

permissions:
  contents: read

env:
  # Must match tools/structure_export/reference/minecraft-26.3.json (server_jar_sha1).
  MC_SERVER_URL: "https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar"
  MC_SERVER_SHA1: "33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c"

jobs:
  convert-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned mcbuild environment
        working-directory: vendor/mcbuild
        run: uv sync --frozen --extra dev
      - name: Unit tests
        run: uv run --project vendor/mcbuild python -m pytest -q tests/test_structure_export.py
      - name: Committed exports are reproducible and verify against their sources
        run: uv run --project vendor/mcbuild python -m tools.structure_export check exports/structures/*.toml

  live-26-3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install pinned mcbuild environment
        working-directory: vendor/mcbuild
        run: uv sync --frozen --extra dev
      - name: Download and verify the Minecraft 26.3 server
        run: |
          mkdir -p .mc && curl -fsSL "$MC_SERVER_URL" -o .mc/server.jar
          echo "$MC_SERVER_SHA1  .mc/server.jar" | sha1sum -c -
      - name: Place each export on a real 26.3 server and test every cell
        run: |
          for config in exports/structures/*.toml; do
            uv run --project vendor/mcbuild python -m tools.structure_export live "$config" \
              --server-jar .mc/server.jar --java java --work ".mc/live-$(basename "$config" .toml)"
          done

name: Validate repaired ice_box_1

on:
  push:
    branches:
      - repair/ice-box-entrance-accessibility-20261016
    paths:
      - tools/inspect_ice_box_accessibility.py
      - tools/test_ice_box_accessibility.py
      - tools/render_approved_ancient_followup.py
      - artifacts/ancient-city-restoration/approved-followup/README.md
      - .github/workflows/repair-ice-box-accessibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard exact base and ice_box_1-only change scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base="7ffa4ec3877f585d4cb205ffed610c9b06a81910"
          subprocess.run(["git","merge-base","--is-ancestor",base,"HEAD"],check=True)
          actual=subprocess.check_output(["git","rev-parse","origin/prototype/ancient-city-armory-coldstore-statue-20261014"],text=True).strip()
          assert actual==base, ("Production base moved; stop",actual)
          allowed={
            "tools/inspect_ice_box_accessibility.py",
            "tools/test_ice_box_accessibility.py",
            "tools/render_approved_ancient_followup.py",
            "artifacts/ancient-city-restoration/approved-followup/README.md",
            ".github/workflows/repair-ice-box-accessibility.yml",
          }
          paths=set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          assert paths<=allowed, ("Out-of-scope files",sorted(paths-allowed))
          print("PASS: exact production base; only ice_box_1 validation/render/docs files changed.")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install existing locked dependencies
        working-directory: vendor/mcbuild
        run: uv sync --frozen --extra dev
      - name: Run regression validation and generate ice_box_1 deliverables
        run: vendor/mcbuild/.venv/bin/python tools/test_ice_box_accessibility.py
      - name: Publish diagnostic summary
        if: always()
        run: |
          if [ -f out/ice-box-inspection/README.md ]; then
            cat out/ice-box-inspection/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload inspection, candidate NBT, schematic, renders and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-ice-box-${{ github.sha }}
          path: out/ice-box-inspection/
          if-no-files-found: error
          retention-days: 14

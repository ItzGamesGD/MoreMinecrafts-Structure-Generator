name: Sync mcbuild upstream (patch-preserving)

# Manual only. This never pushes to main or to the base branch. It builds vendor/mcbuild from the pinned upstream
# commit plus the local patch series in vendor/patches/mcbuild/, then opens a Draft PR from a
# vendor-sync/* branch for review. If any patch no longer applies, the job fails and nothing
# is pushed.
on:
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: "Upstream harrynull/mcbuild commit to vendor (full 40-char SHA). Empty keeps the current pin."
        required: false
        default: ""
      base_ref:
        description: "Branch whose vendor tree and patch series are the base (and the PR target). Default main."
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository (base branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          path: repo

      - name: Resolve upstream pin
        id: pin
        shell: bash
        env:
          REQUESTED: ${{ inputs.upstream_sha }}
        run: |
          set -euo pipefail
          sha="${REQUESTED:-$(cat repo/vendor/mcbuild/UPSTREAM_COMMIT)}"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::upstream pin is not a full 40-character commit SHA: $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: harrynull/mcbuild
          ref: ${{ steps.pin.outputs.sha }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Build vendor tree from pin + patches
        shell: bash
        env:
          PIN: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$PIN"
          # Fails the job if any local patch does not apply cleanly to this upstream commit.
          repo/vendor/patches/apply.sh upstream built

      - name: Replace vendored tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf repo/vendor/mcbuild
          cp -a built repo/vendor/mcbuild
          git -C repo add -A vendor/mcbuild

      - name: Open Draft PR if the snapshot changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ steps.pin.outputs.sha }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          cd repo
          if git diff --cached --quiet; then
            echo "vendor/mcbuild already matches pin ${PIN:0:12} plus patches."
            exit 0
          fi
          branch="vendor-sync/${PIN:0:12}"
          base="${BASE_REF}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "vendor: sync mcbuild to ${PIN:0:12}, re-applying local patches"
          git push -u origin "$branch"
          body="Vendors harrynull/mcbuild at \`${PIN}\` and re-applies vendor/patches/mcbuild/ (applied cleanly).

          Review checklist:
          - [ ] Upstream diff reviewed (compare against the previous UPSTREAM_COMMIT)
          - [ ] mcbuild-ci checks pass, including the vendor-drift job
          - [ ] Security regression tests still present (tests/test_dsl_sandbox.py, test_sandbox_isolation.py, test_ws_server_security.py)

          Do not merge without review. This PR was generated by the vendor-mcbuild workflow."
          gh pr create --draft --base "$base" --head "$branch" \
            --title "vendor: sync mcbuild to ${PIN:0:12} (patches re-applied)" \
            --body "$body"

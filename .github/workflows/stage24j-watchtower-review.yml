name: Stage 24-J watchtower review

on:
  workflow_dispatch:
  push:
    branches:
      - ci-probe/stage24-b2
      - stage-24j-watchtower-review
    paths:
      - "tools/stage24j/**"
      - "tests/test_stage24j_watchtowers.py"
      - "artifacts/ancient-city-restoration/stage-24j/**"
      - "artifacts/ancient-city-restoration/DESIGN-DECISIONS.md"
      - ".github/workflows/stage24j-watchtower-review.yml"

permissions:
  contents: read

env:
  MC_SERVER_URL: "https://piston-data.mojang.com/v1/objects/97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51/server.jar"
  MC_SERVER_SHA1: "97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51"

jobs:
  watchtower-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the Stage 24-B/24-E/24-F suites read pinned commits with git show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install pinned mcbuild environment
        working-directory: vendor/mcbuild
        run: uv sync --frozen --extra dev
      - name: Production packs (24-G, 24-H, 24-I) rebuild unchanged; proposals rebuild byte-identical
        run: |
          vendor/mcbuild/.venv/bin/python tools/stage24g/build.py > /dev/null
          vendor/mcbuild/.venv/bin/python tools/stage24h/build.py > /dev/null
          vendor/mcbuild/.venv/bin/python tools/stage24h/mask_doc.py
          vendor/mcbuild/.venv/bin/python tools/stage24i/build.py > /dev/null
          vendor/mcbuild/.venv/bin/python -c "import sys; sys.path.insert(0, '.'); from pathlib import Path; from tools.stage24j.designs import build; build(Path('artifacts/ancient-city-restoration/stage-24j/proposals'))"
          git diff --exit-code -- artifacts/ancient-city-restoration/stage-24g artifacts/ancient-city-restoration/stage-24h artifacts/ancient-city-restoration/stage-24i/datapack artifacts/ancient-city-restoration/stage-24i/roof artifacts/ancient-city-restoration/stage-24j/proposals
      - name: Approved structure NBTs are byte-identical to Stage 24-F
        run: |
          cd artifacts/ancient-city-restoration/stage-24f/final-candidates && sha256sum -c SHA256SUMS
          for m in large_ruin_1 medium_ruin_1 medium_ruin_2 small_ruin_1 small_ruin_2 sauna_1 large_pillar_1 medium_pillar_1; do
            cmp $m/restored.nbt ../../stage-24i/datapack/data/minecraft/structure/ancient_city/structures/$m.nbt
          done
      - name: Download and verify the Minecraft 26.1.2 server
        run: |
          mkdir -p .mc && curl -fsSL "$MC_SERVER_URL" -o .mc/server.jar
          echo "$MC_SERVER_SHA1  .mc/server.jar" | sha1sum -c -
      - name: Static feasibility checks against the vanilla block report from the pinned jar
        run: |
          (cd .mc && java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --reports --output "$RUNNER_TEMP/reports" > /dev/null)
          vendor/mcbuild/.venv/bin/python tools/stage24j/check.py --reports "$RUNNER_TEMP/reports/reports/blocks.json" > /dev/null
          git diff --exit-code -- artifacts/ancient-city-restoration/stage-24j/static-checks.json
      - name: Stage 24-J, 24-I, 24-H and 24-G tests
        run: vendor/mcbuild/.venv/bin/python -m pytest tests/test_stage24j_watchtowers.py tests/test_stage24i_roof.py tests/test_stage24h_clearance.py tests/test_stage24g_protection.py -q
      - name: Live exact placement on a real 26.1.2 server, 6 towers x 4 rotations
        env:
          MC_JAR: ${{ github.workspace }}/.mc/server.jar
          MC_JAVA: java
        run: |
          vendor/mcbuild/.venv/bin/python tools/stage24j/live.py --no-bot --out "$RUNNER_TEMP/s24j-live"
          vendor/mcbuild/.venv/bin/python tools/stage24j/check_live.py "$RUNNER_TEMP/s24j-live/live-report.json"
      - name: Earlier-stage artifacts are untouched
        run: git diff --exit-code -- artifacts/ancient-city-restoration/stage-24b artifacts/ancient-city-restoration/stage-24e/proposals artifacts/ancient-city-restoration/stage-24f artifacts/ancient-city-restoration/stage-24g artifacts/ancient-city-restoration/stage-24h
      - name: Upload Stage 24-J evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-24j-watchtower-review
          path: |
            artifacts/ancient-city-restoration/stage-24j
            ${{ runner.temp }}/s24j-live
          if-no-files-found: error

name: Ancient City variant structure renders

on:
  push:
    branches:
      - probe/ancient-city-whole-variants-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-candidate-renders:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout generator
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install vendored mcbuild dependencies
        working-directory: vendor/mcbuild
        run: uv sync --frozen --extra dev

      - name: Render six real candidates, validate Sponge v3 schematics
        run: |
          set -euo pipefail
          vendor/mcbuild/.venv/bin/python tools/render_ancient_city_variants.py

      - name: Upload full candidate renders and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ancient-city-whole-variant-candidates-${{ github.run_id }}
          path: out/ancient-city-variants/
          if-no-files-found: warn
          retention-days: 30

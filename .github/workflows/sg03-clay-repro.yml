name: SG-03 clay overwrite reproduction

on:
  pull_request:
    paths:
      - "validation/minecraft-visual/sg03-natural/**"
      - ".github/workflows/sg03-clay-repro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natural-world:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [42]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Build SG-03 and verify committed datapack
        run: |
          python3 -m pip install -r requirements-export.txt numpy
          python3 examples/forgotten_kingdom/build_sg03.py "$RUNNER_TEMP/pack"
          diff -r exports/sg-03/forgotten-underground-kingdom/datapack "$RUNNER_TEMP/pack"
          python3 -m unittest discover -s validation/minecraft-visual/sg03-natural -p 'test_*.py' -v
      - name: Download official 26.3 server with SHA-1 verification
        run: bash validation/minecraft-visual/sg03-natural/fetch-server.sh "$RUNNER_TEMP/server.jar" 26.3
      - name: Naturally generate SG-03 and inspect 21 Jigsaw pieces
        timeout-minutes: 35
        run: |
          set +e
          python3 validation/minecraft-visual/sg03-natural/run_natural.py \
            --jar "$RUNNER_TEMP/server.jar" --pack "$RUNNER_TEMP/pack" \
            --out "$RUNNER_TEMP/sg03-natural" --seed ${{ matrix.seed }} --sites 2 --ticks 200
          result=$?
          echo "Natural integrity exit: $result (failure is expected only for known clay overwrite)"
          test "$result" -eq 1
      - name: Verify clay overwrite reproduced without waiving integrity failure
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "sg03-natural/natural-42.json"
          d = json.loads(p.read_text())
          target = next(s for s in d["sites"] if s["candidate_chunk"] == [4, 13])
          assert d["pass"] is False
          for phase in ("before_ticks", "after_ticks"):
              item = target[phase]
              details = item["clay_replacement_diagnostics"]
              print("CLAY_DIAGNOSTIC", json.dumps(details, sort_keys=True))
              assert details["count"] == 47
              assert item["piece_count"] == 21 and not item["pass"]
          print("REPRODUCTION PASS; NATURAL INTEGRITY FAIL (unchanged)")
          PY
      - name: Print natural-world site diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import json
          for name in glob.glob("/home/runner/work/_temp/sg03-natural/natural-*.json"):
              result = json.load(open(name))
              print("NATURAL_VALIDATION", result.get("seed"), "PASS", result.get("pass"), "ERROR", result.get("error"))
              for site in result.get("sites", []):
                  for stage in ("before_ticks", "after_ticks"):
                      check = site.get(stage, {})
                      print(json.dumps({
                          "site": site.get("candidate_chunk"), "stage": stage,
                          "pass": check.get("pass"), "generated": site.get("generated"),
                          "pieces": check.get("piece_count"), "rooms": check.get("rooms"),
                          "expected": check.get("expected"), "matched": check.get("matched"),
                          "overwrites": check.get("overwrites"),
                          "missing_or_other": check.get("missing_or_other"),
                          "examples": check.get("examples"),
                          "interior_fluids": check.get("interior_fluids"),
                          "exterior_contacts": check.get("exterior_contacts"),
                          "spawner_entities": check.get("trial_spawner_entities"),
                          "spawner_blocks": check.get("trial_spawners"),
                          "errors": check.get("errors"),
                      }, sort_keys=True))
          PY
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg03-natural-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sg03-natural/natural-*.json
            ${{ runner.temp }}/sg03-natural/server-*.log
          if-no-files-found: warn
          retention-days: 30

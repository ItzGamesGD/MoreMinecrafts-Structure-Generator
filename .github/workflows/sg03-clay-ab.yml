name: SG-03 clay feature A-B
on:
  pull_request:
    paths:
      - "validation/minecraft-visual/sg03-natural/**"
      - ".github/workflows/sg03-clay-ab.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clay-feature-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Build and verify exact control datapack
        run: |
          python3 -m pip install -r requirements-export.txt numpy
          python3 examples/forgotten_kingdom/build_sg03.py "$RUNNER_TEMP/control-pack"
          diff -r exports/sg-03/forgotten-underground-kingdom/datapack "$RUNNER_TEMP/control-pack"
          python3 -m unittest discover -s validation/minecraft-visual/sg03-natural -p 'test_*.py' -v
          python3 -m unittest discover -s validation/minecraft-visual/sg03-natural/ab -p 'test_*.py' -v
      - name: Make isolated treatment with clay placement count zero
        run: |
          cp -a "$RUNNER_TEMP/control-pack" "$RUNNER_TEMP/treatment-pack"
          mkdir -p "$RUNNER_TEMP/treatment-pack/data/minecraft/worldgen/placed_feature"
          cp validation/minecraft-visual/sg03-natural/ab/disable-lush-caves-clay.json "$RUNNER_TEMP/treatment-pack/data/minecraft/worldgen/placed_feature/lush_caves_clay.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          name = "data/minecraft/worldgen/placed_feature/lush_caves_clay.json"
          a, b = root/"control-pack", root/"treatment-pack"
          assert json.loads((b/name).read_text()) == {"feature":"minecraft:lush_caves_clay","placement":[{"type":"minecraft:count","count":0}]}
          def snap(p):
              return {str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob("*") if f.is_file()}
          x, y = snap(a), snap(b)
          assert set(y)-set(x) == {name} and all(x[k] == y[k] for k in x)
          print("Treatment-only file:", name)
          PY
      - name: Fetch official 26.3 server with SHA-1 check
        run: bash validation/minecraft-visual/sg03-natural/fetch-server.sh "$RUNNER_TEMP/server.jar" 26.3
      - name: Generate same seed and candidate order independently
        timeout-minutes: 30
        run: |
          set +e
          python3 validation/minecraft-visual/sg03-natural/run_natural.py --jar "$RUNNER_TEMP/server.jar" --pack "$RUNNER_TEMP/control-pack" --out "$RUNNER_TEMP/sg03-control" --seed 42 --sites 2 --ticks 200
          a=$?
          python3 validation/minecraft-visual/sg03-natural/run_natural.py --jar "$RUNNER_TEMP/server.jar" --pack "$RUNNER_TEMP/treatment-pack" --out "$RUNNER_TEMP/sg03-treatment" --seed 42 --sites 2 --ticks 200
          b=$?
          set -e
          echo "Control integrity exit: $a; treatment integrity exit: $b"
          test "$a" -le 1 && test "$b" -le 1
      - name: Independently compare starts and exact clay coordinates
        run: |
          python3 validation/minecraft-visual/sg03-natural/ab/compare_ab.py --control "$RUNNER_TEMP/sg03-control/natural-42.json" --treatment "$RUNNER_TEMP/sg03-treatment/natural-42.json" --out "$RUNNER_TEMP/sg03-ab/compare-42.json"
      - name: Upload complete experimental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg03-clay-ab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sg03-control/natural-42.json
            ${{ runner.temp }}/sg03-control/server-42.log
            ${{ runner.temp }}/sg03-treatment/natural-42.json
            ${{ runner.temp }}/sg03-treatment/server-42.log
            ${{ runner.temp }}/sg03-ab/compare-42.json
          if-no-files-found: warn
          retention-days: 30

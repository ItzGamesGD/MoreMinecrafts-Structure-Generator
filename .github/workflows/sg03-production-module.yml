name: SG-03 production module

# N10: the check that actually loads the approved protection module. It builds the production jar, verifies its contents, starts the real
# server with the jar loaded as a mod (no lab mod), generates natural SG-03 sites and asserts that every template cell is intact and that the
# write guard was loaded, exercised and never "unavailable". The vanilla baseline lives in sg03-n4-clay.yml and is diagnostic for non-clay damage.

on:
  pull_request:
    paths:
      - "mod/**"
      - "validation/minecraft-visual/sg03-natural/**"
      - "exports/sg-03/**"
      - "tests/test_n*.py"
      - ".github/workflows/sg03-production-module.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-module:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (module sources, harness, check logic)
        run: |
          python3 -m pip install -r requirements-export.txt numpy nbtlib
          python3 -m unittest discover -s tests -p 'test_n*.py'
      - name: Verify the committed SG-03 datapack
        run: |
          python3 examples/forgotten_kingdom/build_sg03.py "$RUNNER_TEMP/pack"
          diff -r exports/sg-03/forgotten-underground-kingdom/datapack "$RUNNER_TEMP/pack"
      - name: Build the production jar and verify its contents
        run: python3 validation/minecraft-visual/sg03-natural/verify_artifacts.py "$RUNNER_TEMP/artifacts.json" --build
      - name: Record the artifact hash
        run: sha256sum mod/sg-worldgen-protection/build/libs/sg-worldgen-protection-*.jar | tee "$RUNNER_TEMP/jar.sha256"
      - name: Download official 26.3 server with SHA-1 verification
        run: bash validation/minecraft-visual/sg03-natural/fetch-server.sh "$RUNNER_TEMP/server.jar" 26.3
      - name: Production jar integration check (strict integrity, write guard loaded and exercised)
        timeout-minutes: 40
        env:
          SERVER_JAR: ${{ runner.temp }}/server.jar
          SG_PACK: ${{ github.workspace }}/exports/sg-03/forgotten-underground-kingdom/datapack
        run: python3 validation/minecraft-visual/sg03-natural/production_module_check.py --out "$RUNNER_TEMP/pmc"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg03-production-module-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pmc/**/lab.json
            ${{ runner.temp }}/pmc/**/*.log
            ${{ runner.temp }}/artifacts.json
            ${{ runner.temp }}/jar.sha256
          if-no-files-found: warn
          retention-days: 30
